name: Build Android APK

on:
  push:
    branches: ['claude/**', master, main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Collect web files
        run: |
          mkdir -p www
          cp index.html style.css game.js characters.js manifest.json www/
          cp -r lib icons sounds www/

      - name: Create Android project
        run: |
          npm install
          npx cap add android

      - name: Patch (landscape, fullscreen, icon)
        run: |
          pip install pillow
          python3 scripts/patch_android.py

      - name: Sync web files into the app
        run: npx cap sync android

      - name: Restore signing key (kept between builds so updates install over each other)
        uses: actions/cache@v4
        with:
          path: keystore
          key: voidbrawl-keystore-v1

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Align and sign (v1 + v2 + v3) and verify
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "build-tools: $BT"
          if [ ! -f keystore/voidbrawl.jks ]; then
            mkdir -p keystore
            keytool -genkeypair -keystore keystore/voidbrawl.jks -alias voidbrawl -keyalg RSA -keysize 2048 \
              -validity 10000 -storepass voidbrawl123 -keypass voidbrawl123 \
              -dname "CN=Void Brawl, O=Void Brawl, C=IN"
          fi
          UNSIGNED=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          echo "unsigned: $UNSIGNED"
          "$BT/zipalign" -p -f 4 "$UNSIGNED" aligned.apk
          "$BT/apksigner" sign --ks keystore/voidbrawl.jks --ks-key-alias voidbrawl \
            --ks-pass pass:voidbrawl123 --key-pass pass:voidbrawl123 --out VoidBrawl.apk aligned.apk
          "$BT/zipalign" -c -P 16 4 VoidBrawl.apk && echo "zipalign OK"
          "$BT/apksigner" verify --verbose --print-certs VoidBrawl.apk
          "$BT/aapt2" dump badging VoidBrawl.apk | head -12
          "$BT/aapt2" dump xmltree --file AndroidManifest.xml VoidBrawl.apk | grep -i -E "debuggable|minSdk|targetSdk" || true
          ls -l VoidBrawl.apk

      - name: Upload as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoidBrawl-apk
          path: VoidBrawl.apk

      - name: Publish as a downloadable release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Void Brawl for Android (latest)
          body: Download **VoidBrawl.apk** below on your Android phone, open it and install (allow "install unknown apps" if asked).
          prerelease: true
          files: VoidBrawl.apk
